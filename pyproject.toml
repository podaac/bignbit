[tool.poetry]
name = "bignbit"
version = "0.9.0a1"
description = "Browse image generation and transfer"
authors = ["PO.DAAC <podaac@jpl.nasa.gov>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.40"
cumulus-message-adapter-python = "^2.4.0"
harmony-py = "^1.4.0"
cumulus-process = "^1.7.0"
python-graphql-client = "^0.4.3"
requests = "^2.34.2"
# GDAL is optional so that conda/micromamba can own it during local dev and CI (where it
# provides libgdal.so alongside the python bindings). The Docker build activates the "gdal"
# extra to install the PyPI bindings against the osgeo/gdal base image's system GDAL.
gdal = {version = "3.13.1", optional = true}
importlib-resources = "^7.1.0"

[tool.poetry.extras]
gdal = ["gdal"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
moto = "^5.2.2"
pylint = "^4.0.6"
flake8 = "^7.3.0"
pytest-cov = "^7.1.0"
boto3-stubs = "^1.40"
vcrpy = "^8.2.1"
pytest-recording = "^0.13.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
